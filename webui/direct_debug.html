<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Kronos 预测请求调试工具</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        .section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 5px; }
        .log { background: #f5f5f5; padding: 10px; border-radius: 3px; font-family: monospace; white-space: pre-wrap; max-height: 300px; overflow-y: auto; }
        button { padding: 10px 15px; margin: 5px; background: #007bff; color: white; border: none; border-radius: 3px; cursor: pointer; }
        button:hover { background: #0056b3; }
        .error { color: red; }
        .success { color: green; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 Kronos 预测请求调试工具</h1>
        
        <div class="section">
            <h2>📊 当前状态检查</h2>
            <button onclick="checkCurrentStatus()">检查当前状态</button>
            <div id="statusLog" class="log"></div>
        </div>
        
        <div class="section">
            <h2>🚀 手动发送预测请求</h2>
            <div>
                <label>股票代码: <input type="text" id="stockCode" value="600519" placeholder="如: 600519"></label><br>
                <label>回溯天数: <input type="number" id="lookback" value="100"></label><br>
                <label>预测天数: <input type="number" id="predLen" value="30"></label><br>
                <label>开始日期: <input type="date" id="startDate"></label><br>
                <button onclick="sendManualRequest()">发送预测请求</button>
            </div>
            <div id="manualLog" class="log"></div>
        </div>
        
        <div class="section">
            <h2>📡 请求捕获监控</h2>
            <button onclick="startCapture()">开始监控</button>
            <button onclick="stopCapture()">停止监控</button>
            <div id="captureLog" class="log"></div>
        </div>
        
        <div class="section">
            <h2>🔧 前端代码调试</h2>
            <button onclick="debugFrontendCode()">调试前端代码</button>
            <div id="debugLog" class="log"></div>
        </div>
    </div>

    <script>
        let captureInterval;
        let originalFetch = window.fetch;
        let originalXHR = window.XMLHttpRequest;
        
        // 检查当前状态
        function checkCurrentStatus() {
            const log = document.getElementById('statusLog');
            log.innerHTML = '';
            
            const status = {
                '股票代码': document.getElementById('stock-code-input')?.value || '未找到',
                '模型加载状态': window.modelLoaded ? '已加载' : '未加载',
                '当前数据文件': window.currentDataFile || '未设置',
                '预测按钮状态': document.querySelector('#prediction-button')?.disabled ? '禁用' : '启用',
                '页面URL': window.location.href
            };
            
            log.innerHTML = '📊 当前状态检查结果:\n';
            for (const [key, value] of Object.entries(status)) {
                log.innerHTML += `${key}: ${value}\n`;
            }
        }
        
        // 手动发送预测请求
        async function sendManualRequest() {
            const log = document.getElementById('manualLog');
            log.innerHTML = '';
            
            const params = {
                file_path: `stock_${document.getElementById('stockCode').value}_live`,
                lookback: parseInt(document.getElementById('lookback').value),
                pred_len: parseInt(document.getElementById('predLen').value),
                start_date: document.getElementById('startDate').value || '',
                temperature: 1.3,
                top_p: 0.98,
                sample_count: 2
            };
            
            log.innerHTML += '📦 发送的请求参数:\n' + JSON.stringify(params, null, 2) + '\n\n';
            
            try {
                const response = await fetch('/api/predict', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(params)
                });
                
                log.innerHTML += `📥 响应状态: ${response.status} ${response.statusText}\n`;
                
                if (response.ok) {
                    const result = await response.json();
                    log.innerHTML += '✅ 请求成功!\n';
                    log.innerHTML += '📊 响应数据预览:\n' + JSON.stringify(result, null, 2).substring(0, 1000) + '\n';
                } else {
                    const errorText = await response.text();
                    log.innerHTML += `❌ 请求失败: ${errorText}\n`;
                }
            } catch (error) {
                log.innerHTML += `💥 请求异常: ${error.message}\n`;
            }
        }
        
        // 开始捕获监控
        function startCapture() {
            const log = document.getElementById('captureLog');
            log.innerHTML = '🔍 开始监控网络请求...\n';
            
            // 拦截fetch请求
            window.fetch = function(...args) {
                const url = args[0];
                if (typeof url === 'string' && url.includes('/api/predict')) {
                    log.innerHTML += `📡 捕获到fetch请求: ${url}\n`;
                    if (args[1] && args[1].body) {
                        log.innerHTML += `📦 请求数据: ${args[1].body}\n`;
                    }
                }
                return originalFetch.apply(this, args);
            };
            
            // 拦截XMLHttpRequest
            const originalOpen = XMLHttpRequest.prototype.open;
            XMLHttpRequest.prototype.open = function(method, url, ...args) {
                if (typeof url === 'string' && url.includes('/api/predict')) {
                    log.innerHTML += `📡 捕获到XHR请求: ${method} ${url}\n`;
                    
                    const originalSend = this.send;
                    this.send = function(data) {
                        if (data) {
                            log.innerHTML += `📦 请求数据: ${data}\n`;
                        }
                        return originalSend.call(this, data);
                    };
                }
                return originalOpen.call(this, method, url, ...args);
            };
            
            log.innerHTML += '✅ 监控已启动，请在前端页面点击预测按钮...\n';
        }
        
        // 停止捕获监控
        function stopCapture() {
            const log = document.getElementById('captureLog');
            window.fetch = originalFetch;
            log.innerHTML += '🛑 监控已停止\n';
        }
        
        // 调试前端代码
        function debugFrontendCode() {
            const log = document.getElementById('debugLog');
            log.innerHTML = '';
            
            // 检查startPrediction函数是否存在
            if (typeof window.startPrediction === 'function') {
                log.innerHTML += '✅ startPrediction函数存在\n';
                
                // 模拟调用startPrediction
                try {
                    log.innerHTML += '🔍 模拟调用startPrediction...\n';
                    
                    // 设置必要的全局变量
                    window.currentDataFile = 'stock_600519_live';
                    window.modelLoaded = true;
                    
                    log.innerHTML += '✅ 模拟环境设置完成\n';
                } catch (error) {
                    log.innerHTML += `❌ 模拟调用失败: ${error.message}\n`;
                }
            } else {
                log.innerHTML += '❌ startPrediction函数不存在\n';
            }
        }
    </script>
</body>
</html>
